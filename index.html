<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your own diary</title><link rel="stylesheet" href="style.css"><body><header><button id="home">YOUR OWN DIARY</button><nav><button id="backup">Export</button><label class="button">Import<input id="restore" type="file" accept="application/json" hidden></label><span id="status">Saved locally</span></nav></header><main id="app"></main><footer><button id="prev" aria-label="Previous page">←</button><span id="page"></span><button id="next" aria-label="Next page">→</button></footer><dialog id="crop"><form method="dialog"><header><h2>Cut a memory</h2><button value="cancel">×</button></header><div class="crop-preview"><img id="preview" alt="Crop preview"></div><label>Zoom<input id="zoom" type="range" min="1" max="3" step=".01" value="1"></label><label>Horizontal<input id="cx" type="range" min="0" max="100" value="50"></label><label>Vertical<input id="cy" type="range" min="0" max="100" value="50"></label><label>Shape<select id="shape"><option value="square">Square</option><option value="portrait">Portrait</option><option value="circle">Circle</option></select></label><button id="keep" type="button">Keep this memory</button></form></dialog><input id="upload" type="file" accept="image/*" hidden><script src="app.js"></script></body></html>
